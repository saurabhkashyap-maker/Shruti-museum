
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Museum ❤️</title>

<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#100d12;color:#fff;font-family:Arial,sans-serif}
button{border:1px solid #ffffff30;background:#29202b;color:white;padding:11px 15px;border-radius:12px;cursor:pointer}
button:hover,button.active{background:#a65372;border-color:#f5b4ce}
#app{position:fixed;inset:0}
#topbar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:linear-gradient(#100d12dd,transparent);z-index:5;gap:10px}
.brand{font-size:20px;font-weight:bold;letter-spacing:1px}
.brand span{color:#f2a8c3}
#status{font-size:12px;color:#d9c8d5;margin-top:5px}
#controls{position:fixed;left:16px;bottom:18px;z-index:5;display:flex;flex-wrap:wrap;gap:8px;max-width:70%}
#actions{position:fixed;right:16px;bottom:18px;z-index:5;display:flex;flex-direction:column;gap:8px}
#hint{position:fixed;top:95px;left:50%;transform:translateX(-50%);background:#18121bcc;border:1px solid #ffffff20;border-radius:14px;padding:10px 14px;color:#e8dce5;font-size:12px;text-align:center;max-width:90%;z-index:3}
#upload{display:none}
#loading{position:fixed;inset:0;z-index:10;background:#100d12;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;transition:opacity .7s}
#loading h1{font-size:30px;letter-spacing:2px;margin:0}
#loading p{color:#d4bdcc;font-size:13px}
.heart{font-size:44px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.2)}}
#crosshair{position:fixed;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:#fff7;pointer-events:none}
#mobileHelp{position:fixed;bottom:100px;left:16px;font-size:11px;color:#d6c4d0;z-index:4}
@media(max-width:600px){
 .brand{font-size:16px}
 #topbar{padding:12px}
 #controls{max-width:62%;left:9px;bottom:12px}
 #actions{right:9px;bottom:12px}
 button{padding:10px;font-size:12px}
 #hint{top:80px}
}
</style>
</head>
<body>
<div id="app"></div>

<div id="loading">
  <div class="heart">❤️</div>
  <h1>OUR MUSEUM</h1>
  <p>Preparing your little world...</p>
</div>

<div id="topbar">
  <div>
    <div class="brand">OUR <span>MUSEUM</span> ♡</div>
    <div id="status">Loading your characters...</div>
  </div>
  <div style="display:flex;gap:8px">
    <button id="musicBtn">♫ Music</button>
    <button id="photoBtn">＋ Photos</button>
    <input id="upload" type="file" accept="image/*" multiple>
  </div>
</div>

<div id="hint">WASD / Arrow keys to walk · Drag to look around</div>
<div id="crosshair"></div>

<div id="controls">
  <button data-move="forward">↑</button>
  <button data-move="left">←</button>
  <button data-move="back">↓</button>
  <button data-move="right">→</button>
</div>

<div id="actions">
  <button id="danceBtn">💃 Dance</button>
  <button id="sitBtn">🪑 Sit</button>
  <button id="standBtn">🚶 Stand / Walk</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
(() => {
'use strict';

/* -------------------------------------------------------
   MODEL FILES
   Keep these paths exactly as shown in your folder:
   Our Museum/
     index.html
     models/man.glb
     models/woman.glb
-------------------------------------------------------- */

const MODEL_MAN = './models/man.glb';
const MODEL_WOMAN = './models/woman.glb';

const app = document.getElementById('app');
const statusEl = document.getElementById('status');
const loadingEl = document.getElementById('loading');

if (!window.THREE || !THREE.GLTFLoader) {
  statusEl.textContent = 'Could not load Three.js. Check your internet connection.';
  loadingEl.querySelector('p').textContent = 'Please reload the page when online.';
  return;
}

/* ---------------- SCENE ---------------- */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171019);
scene.fog = new THREE.Fog(0x171019, 16, 48);

const camera = new THREE.PerspectiveCamera(
  65, window.innerWidth / window.innerHeight, 0.1, 120
);
camera.position.set(0, 2.4, 5);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

/* ---------------- LIGHTS ---------------- */

scene.add(new THREE.HemisphereLight(0xffe9f1, 0x34243c, 1.25));

const mainLight = new THREE.PointLight(0xffd5ac, 2.1, 28);
mainLight.position.set(0, 5.5, 0);
scene.add(mainLight);

const warmLight = new THREE.PointLight(0xff8eaf, 1.15, 18);
warmLight.position.set(-4, 3, -5);
scene.add(warmLight);

const softLight = new THREE.PointLight(0xb8a1ff, 0.8, 18);
softLight.position.set(5, 3, 3);
scene.add(softLight);

/* ---------------- MATERIAL HELPERS ---------------- */

function material(color, roughness=0.85, metalness=0) {
  return new THREE.MeshStandardMaterial({ color, roughness, metalness });
}

function addBox(w,h,d,x,y,z,mat) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  mesh.position.set(x,y,z);
  scene.add(mesh);
  return mesh;
}

/* ---------------- MUSEUM ROOM ---------------- */

const floorMat = material(0x302531);
const wallMat = material(0x493644);
const trimMat = material(0x9a6b73,0.55,0.2);

addBox(22,0.35,28,0,-0.2,-5,floorMat);
addBox(22,8,0.35,0,3.8,-18,wallMat);
addBox(0.35,8,28,-11,3.8,-5,wallMat);
addBox(0.35,8,28,11,3.8,-5,wallMat);

/* Wall panels and decorative trim */
for (let x=-9; x<=9; x+=3) {
  addBox(0.055,7.5,0.08,x,3.6,-17.78,trimMat);
}
addBox(21.7,0.14,0.16,0,0.1,-17.7,trimMat);
addBox(21.7,0.14,0.16,0,6.9,-17.7,trimMat);

for (let x=-9; x<=9; x+=3) {
  addBox(0.08,0.1,27,x,0.02,-5,trimMat);
}

/* Glowing ceiling fixtures */
for (let x=-6; x<=6; x+=4) {
  const lamp = new THREE.Mesh(
    new THREE.BoxGeometry(1.8,0.08,0.45),
    new THREE.MeshBasicMaterial({color:0xffdfbd})
  );
  lamp.position.set(x,7.45,-5);
  scene.add(lamp);

  const glow = new THREE.PointLight(0xffd6b0,0.65,9);
  glow.position.set(x,6.9,-5);
  scene.add(glow);
}

/* ---------------- PHOTO FRAMES ---------------- */

const photoFrames = [];

function makeFrame(x,y,z,rotationY=0) {
  const group = new THREE.Group();
  group.position.set(x,y,z);
  group.rotation.y = rotationY;

  const frameMat = material(0xb88760,0.45,0.35);
  const backingMat = material(0x211722);

  const backing = new THREE.Mesh(
    new THREE.BoxGeometry(1.75,1.55,0.12), backingMat
  );
  group.add(backing);

  const top = new THREE.Mesh(new THREE.BoxGeometry(1.92,0.12,0.18),frameMat);
  top.position.y=0.84; group.add(top);
  const bottom = top.clone(); bottom.position.y=-0.84; group.add(bottom);

  const sideGeo = new THREE.BoxGeometry(0.12,1.55,0.18);
  const left = new THREE.Mesh(sideGeo,frameMat);
  left.position.x=-0.9; group.add(left);
  const right = left.clone(); right.position.x=0.9; group.add(right);

  const canvas = document.createElement('canvas');
  canvas.width=512; canvas.height=420;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#352535'; ctx.fillRect(0,0,512,420);
  ctx.fillStyle='#f0c0d0'; ctx.font='bold 32px Georgia';
  ctx.textAlign='center'; ctx.fillText('OUR MEMORY',256,190);
  ctx.fillStyle='#ffffff'; ctx.font='70px Georgia';
  ctx.fillText('♡',256,280);

  const texture = new THREE.CanvasTexture(canvas);
  texture.encoding = THREE.sRGBEncoding;

  const picture = new THREE.Mesh(
    new THREE.PlaneGeometry(1.57,1.37),
    new THREE.MeshBasicMaterial({map:texture,side:THREE.DoubleSide})
  );
  picture.position.z=0.075;
  group.add(picture);

  group.userData.picture=picture;
  group.userData.canvas=canvas;
  group.userData.ctx=ctx;
  group.userData.texture=texture;

  scene.add(group);
  photoFrames.push(group);
  return group;
}

for (let x=-9; x<=9; x+=3) {
  makeFrame(x,3.8,-17.55,0);
}

/* Side-wall frames */
for (let z=-14; z<=3; z+=4.5) {
  makeFrame(-10.77,3.8,z,Math.PI/2);
  makeFrame(10.77,3.8,z,-Math.PI/2);
}

/* Photo upload: fills the next available frame */
let nextFrame=0;
document.getElementById('photoBtn').onclick=()=>
  document.getElementById('upload').click();

document.getElementById('upload').addEventListener('change', event=>{
  const files=Array.from(event.target.files || []);
  files.forEach(file=>{
    if(!file.type.startsWith('image/')) return;
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const frame=photoFrames[nextFrame % photoFrames.length];
        nextFrame++;
        const canvas=frame.userData.canvas;
        const ctx=frame.userData.ctx;
        ctx.fillStyle='#211722';
        ctx.fillRect(0,0,canvas.width,canvas.height);

        const scale=Math.max(canvas.width/img.width,canvas.height/img.height);
        const w=img.width*scale, h=img.height*scale;
        ctx.drawImage(img,(canvas.width-w)/2,(canvas.height-h)/2,w,h);
        frame.userData.texture.needsUpdate=true;
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
  event.target.value='';
});

/* ---------------- DECOR ---------------- */

/* Small warm glowing orbs along the gallery */
for (let i=0;i<24;i++) {
  const orb=new THREE.Mesh(
    new THREE.SphereGeometry(0.045,10,10),
    new THREE.MeshBasicMaterial({color:i%2?0xffc5da:0xffdfb0})
  );
  orb.position.set((Math.random()-0.5)*18,0.2,-16+Math.random()*22);
  scene.add(orb);
}

/* A small bench */
const benchMat=material(0x6c414e,0.65);
addBox(2.3,0.18,0.55,0,0.75,-8,benchMat);
addBox(2.3,0.85,0.16,0,1.18,-8.2,benchMat);
for (const x of [-0.85,0.85]) {
  addBox(0.12,0.7,0.12,x,0.36,-8,trimMat);
}

/* ---------------- CHARACTERS ---------------- */

const loader = new THREE.GLTFLoader();
const clock = new THREE.Clock();
const keys = {};
const moveButtons = {};
let cameraYaw=0;
let cameraPitch=0.12;
let isDragging=false;
let lastX=0,lastY=0;
let dancing=false;
let sitting=false;
let musicPlaying=false;
let audioContext=null;
let musicNodes=[];

function makeCharacterPlaceholder(color) {
  const root=new THREE.Group();
  const bodyMat=material(color);
  const skinMat=material(0xd3a080);
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.24,0.65,4,8),bodyMat);
  body.position.y=1.05;
  root.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.23,16,12),skinMat);
  head.position.y=1.72;
  root.add(head);
  scene.add(root);
  return root;
}

let player=makeCharacterPlaceholder(0x8b496b);
let partner=makeCharacterPlaceholder(0x4f779d);
player.position.set(-1,0,2);
partner.position.set(1,0,0.8);

function findClip(clips, words) {
  const lowered=clips.map(c=>({clip:c,name:c.name.toLowerCase()}));
  for (const word of words) {
    const match=lowered.find(item=>item.name.includes(word));
    if(match) return match.clip;
  }
  return null;
}

function playCharacterAnimation(character, requested) {
  const data=character && character.userData;
  if(!data || !data.mixer || !data.actions) return false;

  const words={
    idle:['idle','stand','breath','rest'],
    walk:['walk','walking','run','locomotion'],
    dance:['dance','dancing','salsa','hip'],
    sit:['sit','sitting','chair']
  }[requested] || [requested];

  const clip=findClip(data.clips,words);
  if(!clip) {
    data.requestedAnimation=requested;
    return false;
  }

  const next=data.mixer.clipAction(clip);
  if(data.currentAction!==next) {
    next.reset();
    next.enabled=true;
    next.setEffectiveWeight(1);
    next.setEffectiveTimeScale(1);
    next.setLoop(requested==='sit'?THREE.LoopRepeat:THREE.LoopRepeat,Infinity);
    next.clampWhenFinished=false;
    if(data.currentAction) data.currentAction.crossFadeTo(next,0.25,true);
    next.play();
    data.currentAction=next;
  }
  data.requestedAnimation=requested;
  return true;
}

function loadCharacter(url, oldCharacter, position, label) {
  return new Promise(resolve=>{
    loader.load(url, gltf=>{
      const root=new THREE.Group();
      const model=gltf.scene || gltf.scenes[0];
      root.add(model);

      /* Normalize model size and place its feet on the floor */
      let bounds=new THREE.Box3().setFromObject(model);
      let size=bounds.getSize(new THREE.Vector3());
      if(!Number.isFinite(size.y) || size.y<0.05) {
        throw new Error('The model has no measurable height');
      }

      const desiredHeight=1.72;
      model.scale.multiplyScalar(desiredHeight/size.y);

      bounds.setFromObject(model);
      const center=bounds.getCenter(new THREE.Vector3());
      model.position.x-=center.x;
      model.position.z-=center.z;
      model.position.y-=bounds.min.y;

      root.position.copy(position);
      root.rotation.y=label==='Man'?Math.PI:0;

      root.userData.mixer=new THREE.AnimationMixer(model);
      root.userData.clips=gltf.animations || [];
      root.userData.currentAction=null;
      root.userData.label=label;
      root.userData.requestedAnimation='idle';

      scene.add(root);
      scene.remove(oldCharacter);

      if(root.userData.clips.length) {
        playCharacterAnimation(root,'idle');
        console.log(label+' animation clips:',root.userData.clips.map(c=>c.name));
      } else {
        console.warn(label+' model has no animation clips.');
      }

      resolve(root);
    },undefined,error=>{
      console.error('Could not load '+url,error);
      statusEl.textContent='Could not load '+label+'. Check models folder and run a local server.';
      resolve(oldCharacter);
    });
  });
}

Promise.all([
  loadCharacter(MODEL_MAN,player,new THREE.Vector3(-1,0,2),'Man'),
  loadCharacter(MODEL_WOMAN,partner,new THREE.Vector3(1,0,0.8),'Woman')
]).then(characters=>{
  player=characters[0];
  partner=characters[1];
  statusEl.textContent='Your museum is ready ❤️';
  loadingEl.style.opacity='0';
  setTimeout(()=>loadingEl.style.display='none',750);
});

/* ---------------- CONTROLS ---------------- */

window.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))
    e.preventDefault();
},{passive:false});

window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

document.querySelectorAll('[data-move]').forEach(button=>{
  const direction=button.dataset.move;
  const down=e=>{e.preventDefault();moveButtons[direction]=true;};
  const up=e=>{e.preventDefault();moveButtons[direction]=false;};
  button.addEventListener('pointerdown',down);
  button.addEventListener('pointerup',up);
  button.addEventListener('pointercancel',up);
  button.addEventListener('pointerleave',up);
});

renderer.domElement.addEventListener('pointerdown',e=>{
  isDragging=true;lastX=e.clientX;lastY=e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove',e=>{
  if(!isDragging)return;
  cameraYaw-=(e.clientX-lastX)*0.004;
  cameraPitch-=(e.clientY-lastY)*0.003;
  cameraPitch=Math.max(-0.35,Math.min(0.65,cameraPitch));
  lastX=e.clientX;lastY=e.clientY;
});
renderer.domElement.addEventListener('pointerup',()=>{isDragging=false;});
renderer.domElement.addEventListener('pointercancel',()=>{isDragging=false;});

/* ---------------- ACTION BUTTONS ---------------- */

function updateActionButtons() {
  document.getElementById('danceBtn').classList.toggle('active',dancing);
  document.getElementById('sitBtn').classList.toggle('active',sitting);
}

document.getElementById('danceBtn').onclick=()=>{
  dancing=!dancing;
  if(dancing) sitting=false;
  updateActionButtons();
};
document.getElementById('sitBtn').onclick=()=>{
  sitting=!sitting;
  if(sitting) dancing=false;
  updateActionButtons();
};
document.getElementById('standBtn').onclick=()=>{
  sitting=false;dancing=false;updateActionButtons();
};

/* ---------------- BACKGROUND MUSIC ---------------- */
/* Generates a gentle ambient melody in the browser. */

function startMusic() {
  const AC=window.AudioContext || window.webkitAudioContext;
  if(!AC) {
    statusEl.textContent='This browser does not support generated music.';
    return;
  }

  audioContext=audioContext || new AC();
  audioContext.resume();

  const master=audioContext.createGain();
  master.gain.value=0.055;
  master.connect(audioContext.destination);
  musicNodes.push(master);

  const notes=[261.63,329.63,392,329.63,293.66,349.23,440,349.23];
  notes.forEach((frequency,i)=>{
    const osc=audioContext.createOscillator();
    const gain=audioContext.createGain();
    osc.type='sine';
    osc.frequency.value=frequency;
    gain.gain.value=0.0001;
    osc.connect(gain);gain.connect(master);
    const t=audioContext.currentTime+i*0.55;
    gain.gain.setValueAtTime(0.0001,t);
    gain.gain.linearRampToValueAtTime(0.35,t+0.12);
    gain.gain.linearRampToValueAtTime(0.0001,t+0.48);
    osc.start(t);
    osc.stop(t+0.52);
    osc.onended=()=>{if(musicPlaying)osc.start(audioContext.currentTime);};
  });
}

document.getElementById('musicBtn').onclick=()=>{
  musicPlaying=!musicPlaying;
  document.getElementById('musicBtn').classList.toggle('active',musicPlaying);
  if(musicPlaying) {
    startMusic();
    statusEl.textContent='Ambient music on ♫';
  } else {
    if(audioContext) audioContext.suspend();
    statusEl.textContent='Music paused';
  }
};

/* ---------------- MOVEMENT + ANIMATION ---------------- */

const clockDeltaLimit=0.05;
let elapsed=0;

function hasMove(direction) {
  if(direction==='forward') return keys.w||keys.arrowup||moveButtons.forward;
  if(direction==='back') return keys.s||keys.arrowdown||moveButtons.back;
  if(direction==='left') return keys.a||keys.arrowleft||moveButtons.left;
  if(direction==='right') return keys.d||keys.arrowright||moveButtons.right;
  return false;
}

function animate() {
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),clockDeltaLimit);
  elapsed+=dt;

  if(player) {
    const forward=hasMove('forward');
    const back=hasMove('back');
    const left=hasMove('left');
    const right=hasMove('right');
    const moving=(forward||back||left||right)&&!sitting&&!dancing;

    if(moving) {
      const direction=new THREE.Vector3();
      direction.z=(forward?1:0)-(back?1:0);
      direction.x=(right?1:0)-(left?1:0);
      direction.normalize();

      const sin=Math.sin(cameraYaw),cos=Math.cos(cameraYaw);
      const dx=direction.x*cos+direction.z*sin;
      const dz=direction.z*cos-direction.x*sin;

      player.position.x+=dx*3.0*dt;
      player.position.z+=dz*3.0*dt;
      player.rotation.y=Math.atan2(dx,dz);
    }

    /* Keep the character inside the museum */
    player.position.x=THREE.MathUtils.clamp(player.position.x,-9.8,9.8);
    player.position.z=THREE.MathUtils.clamp(player.position.z,-16.8,8.5);

    const requested=sitting?'sit':dancing?'dance':moving?'walk':'idle';
    if(player.userData.lastRequested!==requested) {
      playCharacterAnimation(player,requested);
      player.userData.lastRequested=requested;
    }

    /* Gentle fallback motion if the model has no matching clip */
    const matched=player.userData.currentAction;
    if(!matched) {
      player.position.y=(dancing?Math.abs(Math.sin(elapsed*8))*0.09:0);
      if(dancing) player.rotation.y+=dt*2.5;
      if(sitting) player.position.y=-0.18;
      else if(!dancing) player.position.y=0;
    } else {
      player.position.y=0;
    }
  }

  /* Partner's idle / dance / sit state */
  if(partner) {
    const partnerAction=dancing?'dance':sitting?'sit':'idle';
    if(partner.userData.lastRequested!==partnerAction) {
      playCharacterAnimation(partner,partnerAction);
      partner.userData.lastRequested=partnerAction;
    }

    if(!partner.userData.currentAction) {
      partner.position.y=dancing?Math.abs(Math.sin(elapsed*6+1))*0.06:0;
      if(dancing) partner.rotation.y+=dt*1.4;
    } else {
      partner.position.y=0;
    }
  }

  /* Update all loaded animation mixers */
  [player,partner].forEach(character=>{
    if(character?.userData?.mixer) character.userData.mixer.update(dt);
  });

  /* Follow camera */
  if(player) {
    const target=new THREE.Vector3(
      player.position.x,
      player.position.y+1.25,
      player.position.z
    );

    const distance=4.5;
    const horizontal=Math.cos(cameraPitch)*distance;
    camera.position.set(
      target.x+Math.sin(cameraYaw)*horizontal,
      target.y+1.0+Math.sin(cameraPitch)*distance,
      target.z+Math.cos(cameraYaw)*horizontal
    );
    camera.lookAt(target);
  }

  /* Softly animate lights */
  mainLight.intensity=2.05+Math.sin(elapsed*0.7)*0.12;
  renderer.render(scene,camera);
}
animate();

/* ---------------- RESIZE ---------------- */

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

})();
</script>
</body>
</html>
