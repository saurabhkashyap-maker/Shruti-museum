<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Our Museum - For Shruti</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0a0a0a; font-family: 'Georgia', serif; color: white; touch-action: none; }
        
        #loading-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background-color: #0a0a0a; z-index: 100; transition: opacity 1.5s ease;
        }
        h1 { font-size: 2.5rem; font-weight: normal; margin-bottom: 10px; letter-spacing: 2px; text-align: center; }
        .names { font-size: 1.2rem; color: #aaa; margin-bottom: 30px; font-style: italic; }
        .names span { font-family: sans-serif; font-style: normal; color: #555; margin: 0 10px; }
        #start-btn { padding: 12px 40px; background-color: #e0e0e0; color: #000; border: none; border-radius: 25px; font-size: 1rem; cursor: pointer; transition: background 0.3s; }
        #start-btn:hover { background-color: #fff; }

        #scene-container { width: 100vw; height: 100vh; display: none; }
        #hint { position: absolute; bottom: 20px; left: 20px; color: rgba(255, 255, 255, 0.5); font-family: sans-serif; font-size: 14px; display: none; }
        
        #speech-bubble {
            position: absolute; background: white; color: black; padding: 10px 15px;
            border-radius: 15px; font-family: sans-serif; font-size: 14px; font-weight: bold;
            display: none; pointer-events: none; transform: translate(-50%, -100%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 10; white-space: nowrap;
        }
        #speech-bubble::after {
            content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
            border-width: 8px 8px 0; border-style: solid; border-color: white transparent transparent transparent;
        }

        #mobile-controls {
            position: absolute; bottom: 30px; right: 30px; display: none;
            grid-template-columns: 50px 50px 50px; grid-template-rows: 50px 50px 50px;
            gap: 5px; z-index: 50;
        }
        .control-btn {
            background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px; color: white; font-size: 24px; display: flex;
            justify-content: center; align-items: center; user-select: none;
            -webkit-user-select: none; touch-action: none;
        }
        .control-btn:active { background: rgba(255, 255, 255, 0.6); }
        
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }
        #btn-right { grid-column: 3; grid-row: 2; }

        /* Error Screen */
        #error-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; color: red; display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 999; font-family: monospace;
            padding: 20px; text-align: center;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="loading-screen">
        <h1>Our Museum</h1>
        <div class="names">From <span>Saurabh</span> To <span>Shruti</span></div>
        <button id="start-btn">Start</button>
    </div>

    <div id="scene-container">
        <div id="hint">Use WASD or Arrow Keys to walk.</div>
        <div id="speech-bubble">OMG you made this for me 🥺</div>
        
        <div id="mobile-controls">
            <div class="control-btn" id="btn-up">▲</div>
            <div class="control-btn" id="btn-left">◀</div>
            <div class="control-btn" id="btn-right">▶</div>
            <div class="control-btn" id="btn-down">▼</div>
        </div>
    </div>

    <!-- Agar code fail hota hai toh yahan error aayega -->
    <div id="error-screen">
        <h2>Oops! Something went wrong.</h2>
        <p id="error-msg"></p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const startBtn = document.getElementById('start-btn');
        const loadingScreen = document.getElementById('loading-screen');
        const sceneContainer = document.getElementById('scene-container');
        const hint = document.getElementById('hint');
        const speechBubble = document.getElementById('speech-bubble');
        const mobileControls = document.getElementById('mobile-controls');
        const errorScreen = document.getElementById('error-screen');
        const errorMsg = document.getElementById('error-msg');

        // GLOBAL ERROR CATCHER (Agar code phat jaye toh yahan dikhega)
        window.addEventListener('error', function(e) {
            console.error(e);
            loadingScreen.style.display = 'none';
            errorScreen.style.display = 'flex';
            errorMsg.innerText = e.message || "Check developer console (F12) for details.";
        });

        let scene, camera, renderer, boyModel, girlModel;
        let clock = new THREE.Clock();
        const keys = { w: false, a: false, s: false, d: false };
        const speed = 0.08;
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        startBtn.addEventListener('click', () => {
            // Change button text just in case loading takes time
            startBtn.innerText = "Loading..."; 
            
            setTimeout(() => {
                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                    sceneContainer.style.display = 'block';
                    
                    if (isMobile) {
                        mobileControls.style.display = 'grid';
                    } else {
                        hint.style.display = 'block';
                    }
                    
                    try {
                        initThreeJS(); // Try to start 3D
                    } catch (err) {
                        console.error("Init Error:", err);
                        errorScreen.style.display = 'flex';
                        errorMsg.innerText = err.message;
                    }
                }, 1000);
            }, 100);
        });

        function initThreeJS() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f0f0); 

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 5, 10); 

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
            renderer.shadowMap.enabled = true;
            sceneContainer.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const light1 = new THREE.DirectionalLight(0xffffff, 1.5);
            light1.position.set(5, 10, 5);
            light1.castShadow = true;
            scene.add(light1);

            buildRoom();
            addPhotos(); // Isme error handling add ki hai
            addBench();
            loadCharacters(); // Isme error handling add ki hai

            window.addEventListener('keydown', (e) => {
                if (e.key === 'w' || e.key === 'ArrowUp') keys.w = true;
                if (e.key === 's' || e.key === 'ArrowDown') keys.s = true;
                if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = true;
                if (e.key === 'd' || e.key === 'ArrowRight') keys.d = true;
            });

            window.addEventListener('keyup', (e) => {
                if (e.key === 'w' || e.key === 'ArrowUp') keys.w = false;
                if (e.key === 's' || e.key === 'ArrowDown') keys.s = false;
                if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = false;
                if (e.key === 'd' || e.key === 'ArrowRight') keys.d = false;
            });

            setupMobileControls();
            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function setupMobileControls() {
            const bindTouch = (id, keyName) => {
                const el = document.getElementById(id);
                if(!el) return;
                el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; }, {passive: false});
                el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; }, {passive: false});
                el.addEventListener('touchcancel', (e) => { e.preventDefault(); keys[keyName] = false; }, {passive: false});
            };
            bindTouch('btn-up', 'w');
            bindTouch('btn-down', 's');
            bindTouch('btn-left', 'a');
            bindTouch('btn-right', 'd');
        }

        function buildRoom() {
            const floorMat = new THREE.MeshStandardMaterial({ color: 0xdddddd });
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const backWall = new THREE.Mesh(new THREE.PlaneGeometry(30, 10), wallMat);
            backWall.position.set(0, 5, -10);
            backWall.receiveShadow = true;
            scene.add(backWall);
        }

        function addPhotos() {
            // Fake image data URL in case photos are missing
            const placeholderImg = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';
            const textureLoader = new THREE.TextureLoader();
            
            // Try to load photos, if missing, use a grey box instead of crashing
            const photo1 = textureLoader.load('photo1.jpg', undefined, undefined, () => { console.log("photo1.jpg not found"); });
            const photo2 = textureLoader.load('photo2.jpg', undefined, undefined, () => { console.log("photo2.jpg not found"); });
            
            createFrame(-3, 4, -9.9, photo1);
            createFrame(3, 4, -9.9, photo2);
        }

        function createFrame(x, y, z, texture) {
            const frameGroup = new THREE.Group();
            const border = new THREE.Mesh(new THREE.BoxGeometry(2.5, 3, 0.1), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            const photoMat = new THREE.MeshStandardMaterial({ map: texture, color: 0xffffff });
            const photo = new THREE.Mesh(new THREE.PlaneGeometry(2.1, 2.6), photoMat);
            photo.position.z = 0.06;
            frameGroup.add(border);
            frameGroup.add(photo);
            frameGroup.position.set(x, y, z);
            scene.add(frameGroup);
        }

        function addBench() {
            const benchGroup = new THREE.Group();
            const woodMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
            const metalMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const seat = new THREE.Mesh(new THREE.BoxGeometry(4, 0.2, 1.2), woodMat);
            seat.position.y = 1.2;
            seat.castShadow = true;
            benchGroup.add(seat);
            const legGeo = new THREE.BoxGeometry(0.2, 1.2, 1);
            const leg1 = new THREE.Mesh(legGeo, metalMat);
            leg1.position.set(-1.8, 0.6, 0);
            const leg2 = new THREE.Mesh(legGeo, metalMat);
            leg2.position.set(1.8, 0.6, 0);
            benchGroup.add(leg1, leg2);
            benchGroup.position.set(0, 0, -2); 
            scene.add(benchGroup);
        }

        function loadCharacters() {
            const loader = new GLTFLoader();

            // 1. TRY LOADING BOY MODEL
            loader.load('boy.glb', (gltf) => {
                boyModel = gltf.scene;
                boyModel.position.set(0, 0, 2); 
                boyModel.traverse((child) => { if (child.isMesh) child.castShadow = true; });
                scene.add(boyModel);
            }, undefined, (error) => {
                // AGAR MODEL NAHI MILA, TOH CAPSULE BANAO
                console.warn("boy.glb not found, using placeholder.");
                const boyGeo = new THREE.CapsuleGeometry(0.5, 1.5, 4, 8);
                boyModel = new THREE.Mesh(boyGeo, new THREE.MeshStandardMaterial({ color: 0x8B4513 }));
                boyModel.position.set(0, 1.25, 2);
                boyModel.castShadow = true;
                scene.add(boyModel);
            });

            // 2. TRY LOADING GIRL MODEL
            loader.load('girl.glb', (gltf) => {
                girlModel = gltf.scene;
                girlModel.position.set(-2, 0, -6); 
                girlModel.rotation.y = Math.PI; 
                girlModel.traverse((child) => { if (child.isMesh) child.castShadow = true; });
                scene.add(girlModel);
            }, undefined, (error) => {
                // AGAR MODEL NAHI MILA, TOH CAPSULE BANAO
                console.warn("girl.glb not found, using placeholder.");
                const girlGeo = new THREE.CapsuleGeometry(0.5, 1.5, 4, 8);
                girlModel = new THREE.Mesh(girlGeo, new THREE.MeshStandardMaterial({ color: 0x4682B4 }));
                girlModel.position.set(-2, 1.25, -6);
                girlModel.castShadow = true;
                scene.add(girlModel);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (boyModel) {
                if (keys.w) boyModel.position.z -= speed;
                if (keys.s) boyModel.position.z += speed;
                if (keys.a) boyModel.position.x -= speed;
                if (keys.d) boyModel.position.x += speed;

                if (keys.w) boyModel.rotation.y = Math.PI;
                if (keys.s) boyModel.rotation.y = 0;
                if (keys.a) boyModel.rotation.y = -Math.PI / 2;
                if (keys.d) boyModel.rotation.y = Math.PI / 2;

                camera.position.x += (boyModel.position.x - camera.position.x) * 0.1;
                camera.position.z += (boyModel.position.z + 8 - camera.position.z) * 0.1;
                camera.lookAt(boyModel.position.x, 2, boyModel.position.z);

                if (girlModel) {
                    const distance = boyModel.position.distanceTo(girlModel.position);
                    if (distance < 3) {
                        speechBubble.style.display = 'block';
                        const vector = new THREE.Vector3();
                        girlModel.getWorldPosition(vector);
                        vector.y += 2.5; 
                        vector.project(camera);

                        const x = (vector.x * .5 + .5) * window.innerWidth;
                        const y = (vector.y * -.5 + .5) * window.innerHeight;
                        
                        speechBubble.style.left = `${x}px`;
                        speechBubble.style.top = `${y}px`;
                    } else {
                        speechBubble.style.display = 'none';
                    }
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
